services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: recruitiq-v4-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Frontend (React/Vite → served as static SPA) ──────────────────────────
  - type: web
    name: recruitiq-v4-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        sync: false
